# DeepSeek 智能问答助手 —— Nginx 站点配置（停止 / 维护模式）
# 用 dsctl stop 时会自动切换到这份配置

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/maintenance;
    index index.html;

    # 维护期限流：单 IP 每分钟最多 30 次，防止有人恶意刷流量
    limit_req zone=deepseek_api burst=10 nodelay;

    # 维护期间接口直接返回 503，明确告知服务不可用
    location /api/ {
        return 503 "Service is stopped.\n";
        add_header Content-Type text/plain always;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        return 200 "maintenance\n";
        add_header Content-Type text/plain;
    }
}
