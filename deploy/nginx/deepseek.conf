# DeepSeek 智能问答助手 —— Nginx 站点配置（正式运行模式）
# 安装位置：/etc/nginx/conf.d/deepseek.conf
#
# 依赖：nginx.conf 的 http 段需要定义限流 zone（见 deploy/README.md）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/deepseekproject/frontend/dist;
    index index.html;
    client_max_body_size 25m;

    access_log /var/log/nginx/deepseek.access.log;
    error_log  /var/log/nginx/deepseek.error.log;

    # ---------- 访问网关：外人不输入密码连页面都看不到 ----------
    # 密码文件用 htpasswd 生成：htpasswd -c /etc/nginx/.htpasswd_deepseek <用户名>
    auth_basic           "DeepSeek Assistant";
    auth_basic_user_file /etc/nginx/.htpasswd_deepseek;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【关键】SSE 流式输出必须关闭代理缓冲，否则会退化成"一次性返回"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 接口限流防刷
        limit_req zone=deepseek_api burst=20 nodelay;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- 前端 SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
